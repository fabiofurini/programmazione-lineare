# Modello di mkdocs.yml (italiano): lo usa genera_sito.py, che scrive mkdocs.yml.
# Non modificare mkdocs.yml a mano.
site_name: Programmazione lineare · Fabio Furini
site_description: >-
  Programmazione lineare: le dispense del corso online, con definizioni,
  teoremi e dimostrazioni, esempi svolti ed esercizi con le soluzioni.
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/programmazione-lineare/
repo_url: https://github.com/fabiofurini/programmazione-lineare
copyright: >-
  &copy; 2026 Fabio Furini — testi e figure con licenza
  <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>,
  codice con licenza
  <a href="https://github.com/fabiofurini/programmazione-lineare/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/vector-triangle
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: it

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — sito personale
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza Università di Roma
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/laboratorio-ricerca-operativa/
      name: Laboratorio di Ricerca Operativa
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/modellazione-mip/
      name: Modellazione MIP
    - icon: material/math-integral
      link: https://fabiofurini.github.io/analisi-matematica-1/
      name: Analisi Matematica 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/algebra-lineare/
      name: Algebra lineare
    - icon: material/chart-bell-curve
      link: https://fabiofurini.github.io/ottimizzazione-convessa/
      name: Ottimizzazione convessa
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/programmazione-lineare/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/linear-programming/
      lang: en

extra_css:
  - stylesheets/extra.css?v=d60085bd58

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: In questa pagina
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js?v=bff73345a1
  - javascripts/mathjax.js?v=bf833266bf
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js

nav:
  - Home: index.md
  - Funzioni lineari, poliedri e problemi di programmazione lineare:
      - problemi-pl/index.md
      - "1. Funzioni lineari": problemi-pl/01-funzioni-lineari.md
  - Materiale: materiale.md
  - Indice completo: indice.md

      - "11. Algoritmo del simplesso rivisto": esercizi/es-11-simplesso-rivisto.md
      - "12. Algoritmo del simplesso duale rivisto": esercizi/es-12-rivisto-duale.md
      - "13. Il metodo primale-duale": esercizi/es-13-primale-duale.md
      - "14. Analisi di sensitività": esercizi/es-14-sensitivita.md
      - "15. La geometria della programmazione lineare": esercizi/es-15-geometria.md
